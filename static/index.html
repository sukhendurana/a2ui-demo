<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preferred Name Chat</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="chat-shell">
      <header>
        <p class="eyebrow">A2UI + MCP demo</p>
        <h1>Profile assistant</h1>
        <p>Ask to change your preferred name. You will always see a confirmation first.</p>
      </header>
      <section id="chat" class="messages" aria-live="polite">
        <div class="message assistant">Try: “Update my preferred name to Ada Lovelace”.</div>
      </section>
      <form id="composer" class="composer">
        <label class="sr-only" for="message">Message</label>
        <input id="message" autocomplete="off" placeholder="Update my preferred name to…" required />
        <button type="submit">Send</button>
      </form>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
